services:
  hy-smi-exporter:
    image: hy-smi-exporter:latest
    build: .
    container_name: hy-smi-exporter
    privileged: true
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    ports:
      - "9393:9393"
    restart: unless-stopped
    environment:
      NODE_NAME: ${NODE_NAME:-dcu-node-01}
      HY_SMI_EXPORTER_LOG_LEVEL: info
      HY_SMI_EXPORTER_TIMEOUT: 5s
    command:
      - --web.listen-address=:9393
      - --hy-smi.path=hy-smi
