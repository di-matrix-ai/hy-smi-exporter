apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hy-smi-exporter
  namespace: monitoring
  labels:
    app: hy-smi-exporter
spec:
  selector:
    matchLabels:
      app: hy-smi-exporter
  template:
    metadata:
      labels:
        app: hy-smi-exporter
    spec:
      nodeSelector:
        # Adjust to whatever label your cluster uses to mark Hygon DCU nodes.
        hygon.com/dcu: "true"
      hostNetwork: true
      hostPID: false
      tolerations:
        - operator: Exists
      containers:
        - name: hy-smi-exporter
          image: hy-smi-exporter:latest
          imagePullPolicy: IfNotPresent
          args:
            - --web.listen-address=$(NODE_IP):9393
            - --hy-smi.path=hy-smi
            - --log.level=info
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - containerPort: 9393
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: devkfd
              mountPath: /dev/kfd
            - name: devdri
              mountPath: /dev/dri
      volumes:
        - name: devkfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
        - name: devdri
          hostPath:
            path: /dev/dri
            type: Directory
