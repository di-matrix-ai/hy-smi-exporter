name: Format Go once

on:
  push:
    branches:
      - fix-hygon-v1.0.0-feedback

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Format Go sources
        run: gofmt -w .
      - name: Commit formatting and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/format-once.yml
          git commit -m "Format Go sources"
          git push origin HEAD:fix-hygon-v1.0.0-feedback
