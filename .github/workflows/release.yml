name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release materials
        env:
          EXPECTED_MODULE: github.com/${{ github.repository }}
        run: ./scripts/check-release-materials.sh
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release remains draft
        run: |
          echo "GoReleaser created a draft release."
          echo "Verify artifacts, checksums and approvals before publishing it manually."
